[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subhunt"
description = "Live, in-scope subdomains for bug bounty programs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "gabdevele" }]
keywords = ["bug-bounty", "hackerone", "subdomains", "recon", "dns", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
    "dnspython>=2.6",
    "httpx>=0.27",
    "keyring>=24",
    "mcp>=1.2",
    "platformdirs>=4.2",
    "rich>=13.7",
    "tldextract>=5.1",
    "typer>=0.12",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
subhunt = "subhunt.cli:main"

[project.urls]
Homepage = "https://github.com/gabdevele/subhunt"
Repository = "https://github.com/gabdevele/subhunt"
Issues = "https://github.com/gabdevele/subhunt/issues"

[tool.hatch.version]
path = "src/subhunt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["subhunt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/subhunt/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/subhunt"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
